<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/diserve-logo.png">
    <title>Login DiServe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="login-background">
        <iframe src="index.html" title="Catalog DiServe"></iframe>
    </div>
    <div class="login-overlay"></div>
    <main class="login-container">
        <section class="login-box">
            <a href="index.html" class="back-to-catalog">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </a>
            <div class="login-header">
                <h1>Selamat datang kembali</h1>
                <p>Masuk untuk mengakses layanan fasilitas kampus.</p>
            </div>
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" id="email" name="email" placeholder="Masukkan email" autocomplete="email" required>
                    </div>
                    <p id="email-error" class="form-error"></p>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan password">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                    <p id="password-error" class="form-error"></p>
                    <div class="forgot-password-wrapper">
                        <a href="forgotpw.html" class="forgot-password">
                            Lupa password?
                        </a>
                    </div>
                </div>
                <button type="submit" class="btn-login">Masuk</button>
                <div class="register-link">
                    <p>Belum punya akun?</p>
                    <a href="register.html">Daftar sekarang</a>
                </div>
            </form>
            <p class="login-footer">© 2026 DiServe. All rights reserved.</p>
        </section>
    </main>
    <script src="assets/js/login.js"></script>
</body>
</html>
