<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="assets/images/diserve-logo.png">
    <title>Reset Password - DiServe</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/forgotpw.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <main class="login-container">
        <section class="login-box">
            <div class="login-header">
                <h1>Password Baru</h1>
                <p>Buat password baru untuk akun DiServe Anda.</p>
            </div>
            <form class="login-form" id="reset-form">
                <div class="form-group">
                    <label for="new-password">Password Baru</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
                        <button type="button" id="toggle-new-password" class="password-toggle" aria-label="Tampilkan password">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="new-password-confirmation">Konfirmasi Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password-confirmation" required minlength="8" autocomplete="new-password">
                        <button type="button" id="toggle-new-password-confirmation" class="password-toggle" aria-label="Tampilkan password">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <p id="reset-error" class="form-error" role="alert"></p>
                <button type="submit" class="btn-login">Simpan Password</button>
            </form>
            <p id="reset-success" class="hidden success-box" role="status"></p>
            <p class="login-footer">&copy; 2026 DiServe. All rights reserved.</p>
        </section>
    </main>
    <script src="assets/js/action-state.js"></script>
    <script src="assets/js/resetpw.js"></script>
</body>
</html>
